schema_version: 1

baseline:
  repository: https://github.com/JimmyMcBride/plan
  tag: v0.1.29
  revision: 898b2a4c470350c0e9115302c99c6ad27bdead9c
  command: plan
  workspace_schema: 3

normalization:
  line_endings: lf
  path_separator: /
  project_root_token: "<PROJECT>"
  timestamps: rfc3339_token

provider:
  name: github
  transport: injected_fake
  required_ci_live: false

families:
  - id: discuss.assess.remote
    standalone: [discuss, assess, --discussion]
    native: [plan, brainstorm, assess, --discussion]
    retention: migrate
    behavior: assess a GitHub Discussion without mutation
    source_evidence: [internal/planning/collaboration.go, internal/planning/collaboration_test.go]
  - id: discuss.repair.remote
    standalone: [discuss, repair, --discussion]
    native: [plan, brainstorm, repair, --discussion]
    retention: migrate
    behavior: guard and repair a Discussion Specs section
    source_evidence: [internal/planning/collaboration.go, cmd/discuss.go]
  - id: discuss.promote.remote
    standalone: [discuss, promote, --discussion]
    native: [plan, brainstorm, promote, --discussion]
    retention: migrate
    behavior: preview and apply initiative/spec publication actions
    source_evidence: [internal/planning/collaboration.go, internal/planning/collaboration_reconcile.go, internal/planning/collaboration_test.go]
  - id: github.enable
    standalone: [github, enable]
    native: [plan, github, enable]
    retention: migrate
    behavior: preflight GitHub and initialize compatible adapter state
    source_evidence: [internal/planning/github_backend.go, cmd/github.go, cmd/github_test.go]
  - id: github.adopt
    standalone: [github, adopt]
    native: [plan, github, adopt]
    retention: migrate
    behavior: adopt ordered existing planning issues and relationships
    source_evidence: [internal/planning/collaboration.go, cmd/github.go, cmd/github_test.go]
  - id: github.reconcile
    standalone: [github, reconcile]
    native: [plan, github, reconcile]
    retention: migrate
    behavior: reconcile repository, issue, readiness, and Project evidence
    source_evidence: [internal/planning/github_reconcile.go, internal/planning/github_project_drift.go, internal/planning/github_backend_test.go]
  - id: github.project.status
    standalone: [github, project, status]
    native: [plan, github, project, status]
    retention: migrate
    behavior: move a tracked Project item through execution status
    source_evidence: [internal/planning/github_project_status.go, cmd/github.go, cmd/github_test.go]
  - id: check.github
    standalone: [check, project]
    native: [plan, check, project]
    retention: migrate
    behavior: report GitHub Project drift without mutation
    source_evidence: [internal/planning/check.go, internal/planning/github_project_drift.go, internal/planning/github_project_drift_test.go]
  - id: guide.show.remote
    standalone: [guide, show, --discussion]
    native: [plan, guide, show, --discussion]
    retention: migrate
    behavior: render a collaboration guide packet from a Discussion
    source_evidence: [internal/planning/guide_packet.go, cmd/guide.go, cmd/guide_test.go]
  - id: repository.evidence
    operation: CurrentContext
    retention: migrate
    behavior: resolve repository ref, commit, default branch, and planning pull request
    source_evidence: [internal/planning/github_client.go, internal/planning/github_backend_test.go]
  - id: story.github.compatibility
    operation: BuildGitHubStoryIssueContract
    retention: compatibility-only
    behavior: preserve shared repository and planning-PR evidence for legacy story creation
    source_evidence: [internal/planning/github_backend.go, internal/planning/github_backend_test.go]

fixtures:
  - id: local
    workspace: github-v1/fixtures/local
    provider_state: github-v1/provider/fresh.json
  - id: discussion
    workspace: github-v1/fixtures/local
    provider_state: github-v1/provider/discussion.json
  - id: tracked
    workspace: github-v1/fixtures/tracked
    provider_state: github-v1/provider/tracked.json

