    safety:
      mutation: false
      baseline_confirmation: not-required
      target_confirmation: not-required
      partial_failure: false
      manual_fallback_allowed: false
    expected:
      exit_code: 0
      format: json
      stdout_comparison: structural
      stdout: github-v1/golden/discuss-assess.stdout
      stderr: empty
      files: unchanged
      provider_transcript: github-v1/transcripts/discussion-read.json
      github_metadata: unchanged
